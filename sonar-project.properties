sonar.projectKey=BenjaminLeclerc1_whatsapp-groupe4
sonar.organization=benjaminleclerc1

sonar.projectName=WhatsApp Groupe4
sonar.projectVersion=1.0

sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,**/k6/**,**/frontend/**,**/infra/**,**/docs/**,**/*.pb.go

sonar.tests=.
