sonar.coverage.exclusions=**/migrations/**,**/*.sql,**/loadtest/**,**/.github/**,**/docker-compose*.yml,**/Dockerfile,**/k8s/**,**/kustomization.yaml

sonar.sourceEncoding=UTF-8

