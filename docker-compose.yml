version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: ./cmd/api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - USER_SERVICE_URL=http://user-service:8081
      - MESSAGE_SERVICE_URL=http://message-service:8082
      - NOTIFICATION_SERVICE_URL=http://notification-service:8083
      - AUTH_SERVICE_URL=http://auth-service:8084
      - CHANNEL_SERVICE_URL=http://channel-service:8085
      - JWT_SECRET=${JWT_SECRET:-whatsapp-groupe4-secret-change-in-prod}
    depends_on:
      - user-service
      - message-service
      - notification-service
      - auth-service
      - channel-service
    networks:
      - whatsapp-network

  user-service:
    build:
      context: .
      dockerfile: ./cmd/user-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
    networks:
      - whatsapp-network

  message-service:
    build:
      context: .
      dockerfile: ./cmd/message-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
    networks:
      - whatsapp-network

  notification-service:
    build:
      context: .
      dockerfile: ./cmd/notification-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
    networks:
      - whatsapp-network
  auth-service:
    build:
      context: .
      dockerfile: ./cmd/auth-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - JWT_SECRET=${JWT_SECRET:-whatsapp-groupe4-secret-change-in-prod}
    networks:
      - whatsapp-network

  postgres:
    image: postgres:16-alpine
    container_name: whatsapp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: whatsapp
      POSTGRES_PASSWORD: whatsapp_secret
      POSTGRES_DB: whatsapp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - whatsapp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp -d whatsapp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  channel-service:
    build:
      context: .
      dockerfile: ./cmd/channel-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - DATABASE_URL=postgres://whatsapp:whatsapp_secret@postgres:5432/whatsapp_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - whatsapp-network

networks:
  whatsapp-network:
    driver: bridge

volumes:
  postgres_data:
