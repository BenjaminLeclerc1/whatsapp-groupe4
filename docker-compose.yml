version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: ./cmd/api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - USER_SERVICE_URL=http://user-service:8081
      - MESSAGE_SERVICE_URL=http://message-service:8082
      - PRESENCE_SERVICE_URL=http://presence-service:8083
    depends_on:
      - user-service
      - message-service
      - presence-service
    networks:
      - whatsapp-network

  user-service:
    build:
      context: .
      dockerfile: ./cmd/user-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
    networks:
      - whatsapp-network

  message-service:
    build:
      context: .
      dockerfile: ./cmd/message-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
    networks:
      - whatsapp-network

  presence-service:
    build:
      context: .
      dockerfile: ./cmd/presence-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
    networks:
      - whatsapp-network

networks:
  whatsapp-network:
    driver: bridge
