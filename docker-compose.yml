version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: ./cmd/api-gateway/Dockerfile
    ports:
      - "${API_GATEWAY_PORT:-8080}:${API_GATEWAY_PORT:-8080}"
    environment:
      - USER_SERVICE_URL=http://user-service:${USER_SERVICE_PORT:-8081}
      - MESSAGE_SERVICE_URL=http://message-service:${MESSAGE_SERVICE_PORT:-8082}
      - NOTIFICATION_SERVICE_URL=http://notification-service:${NOTIFICATION_SERVICE_PORT:-8083}
      - AUTH_SERVICE_URL=http://auth-service:${AUTH_SERVICE_PORT:-8084}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - user-service
      - message-service
      - notification-service
      - auth-service
    networks:
      - whatsapp-network

  user-service:
    build:
      context: .
      dockerfile: ./cmd/user-service/Dockerfile
    ports:
      - "${USER_SERVICE_PORT:-8081}:${USER_SERVICE_PORT:-8081}"
    environment:
      - PORT=${USER_SERVICE_PORT:-8081}
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - whatsapp-network

  message-service:
    build:
      context: .
      dockerfile: ./cmd/message-service/Dockerfile
    ports:
      - "${MESSAGE_SERVICE_PORT:-8082}:${MESSAGE_SERVICE_PORT:-8082}"
    environment:
      - PORT=${MESSAGE_SERVICE_PORT:-8082}
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - whatsapp-network

  notification-service:
    build:
      context: .
      dockerfile: ./cmd/notification-service/Dockerfile
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8083}:${NOTIFICATION_SERVICE_PORT:-8083}"
    environment:
      - PORT=${NOTIFICATION_SERVICE_PORT:-8083}
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - whatsapp-network

  auth-service:
    build:
      context: .
      dockerfile: ./cmd/auth-service/Dockerfile
    ports:
      - "${AUTH_SERVICE_PORT:-8084}:${AUTH_SERVICE_PORT:-8084}"
    environment:
      - PORT=${AUTH_SERVICE_PORT:-8084}
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-24h}
      - REFRESH_TOKEN_TTL=${REFRESH_TOKEN_TTL:-720h}
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - whatsapp-network

networks:
  whatsapp-network:
    driver: bridge
