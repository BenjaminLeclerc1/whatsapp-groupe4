# CI/CD WhatsApp Groupe4
#
# Déclencheurs :
#   - push / pull_request sur main, develop, feature/*, fix/*, chore/*
#   - workflow_dispatch : onglet Actions → ce workflow → "Run workflow" (pour tester sans push)
#
# Déploiement Azure (optionnel) : secrets AZURE_CREDENTIALS + ACR_NAME sur le dépôt.
#   Voir section "deploy-acr" ci-dessous.

name: CI/CD

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main
      - develop

env:
  GO_VERSION: "1.24"
  TERRAFORM_VERSION: "1.9.8"

jobs:
  # --- Go : tests une fois, puis build de chaque service ---
  go-test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - run: go mod download
      - run: go test ./cmd/... ./internal/... -count=1 -short

  go-build:
    name: Go build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [go-test]
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - chat-service
          - message-service
          - user-service
          - notification-service
          - channel-service
          - search-service
          - presence-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - run: go mod download
      - run: go build -o /tmp/${{ matrix.service }} ./cmd/${{ matrix.service }}

  # --- Docker : une image par microservice ---
  docker-build:
    name: Docker (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [go-build]
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - chat-service
          - message-service
          - user-service
          - notification-service
          - channel-service
          - search-service
          - presence-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./cmd/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: whatsapp-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: whatsapp-${{ matrix.service }}:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

  # --- Terraform : format + validate (sans apply, sans state distant) ---
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Dummy tfvars for validate only
        run: |
          cat > ci.auto.tfvars <<'EOF'
          postgres_admin_password = "ci-dummy-not-used-anywhere"
          jwt_secret                = "ci-dummy-not-used-anywhere"
          images = {
            auth_service    = "example.azurecr.io/auth-service:ci"
            chat_service    = "example.azurecr.io/chat-service:ci"
            message_service = "example.azurecr.io/message-service:ci"
            api_gateway     = "example.azurecr.io/api-gateway:ci"
          }
          EOF

      - name: terraform init (no backend)
        run: terraform init -input=false -backend=false

      - name: terraform validate
        run: terraform validate -no-color

  # --- Frontend : build production (pas de tests interactifs Jest) ---
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # --- CD optionnel : build dans ACR (main + secrets configurés) ---
  deploy-acr:
    name: Deploy images to ACR
    runs-on: ubuntu-latest
    needs: [docker-build, terraform, frontend-build]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_AZURE_CD == 'true'
    environment: production
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - chat-service
          - message-service
          - user-service
          - notification-service
          - channel-service
          - search-service
          - presence-service
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push to ACR
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: |
          IMAGE_TAG="${{ github.sha }}"
          az acr build --registry "$ACR_NAME" \
            --image "${{ matrix.service }}:${IMAGE_TAG}" \
            --image "${{ matrix.service }}:latest" \
            --file "cmd/${{ matrix.service }}/Dockerfile" \
            .
